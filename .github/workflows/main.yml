name: Build Class IX Period Alert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android SDK components
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 5. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Build APK
      - name: Build Class IX Period Alert
        run: |
          gradle --no-daemon \
          -p ClassIXPeriodAlert_AndroidStudio_Source/ClassIXPeriodAlert \
          assembleDebug

      # 7. Upload generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassIXPeriodAlert-APK
          path: ClassIXPeriodAlert_AndroidStudio_Source/ClassIXPeriodAlert/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
